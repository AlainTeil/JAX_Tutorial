[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jax-tutorial"
version = "0.1.0"
description = "A CPU-first JAX deep learning tutorial with executable lessons, notebooks, and tests."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jax[cpu]>=0.9.2,<0.10",
    "flax>=0.12.6,<0.13",
    "optax>=0.2.8,<0.3",
    "nbformat>=5.10.4,<6",
    "jupyter>=1.1.1,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.2,<10",
    "ruff>=0.13,<1",
    "pyright>=1.1,<2",
]

[tool.setuptools.packages.find]
include = ["course", "lessons", "solutions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
markers = [
    "notebook: notebook structure and execution checks",
    "slow: examples that may take longer than ordinary unit tests",
    "multidevice: tests that need more than one local JAX device",
    "integration: tests that exercise several course artifacts together",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
typeCheckingMode = "basic"
include = ["course", "lessons", "solutions", "tests", "tools"]
exclude = ["notebooks", ".venv"]
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportReturnType = false
reportArgumentType = false
reportAttributeAccessIssue = false